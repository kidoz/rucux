name: qemu-armv7-virt
arch: armv7
boot:
  firmware: direct
  bootloader: qemu-direct
runtime:
  emulator: qemu-system-arm
  machine: virt
  cpu: cortex-a15
artifacts:
  kernel: builddir-arm/kernel.elf
platform:
  cpu_count: 1
  uart:
    base: 0x09000000
    fr_offset: 0x18
    tx_full_mask: 0x20
  gic:
    dist_base: 0x08000000
    cpu_base: 0x08010000
  timer:
    irq: 27
  psci:
    conduit: hvc
  power:
    shutdown_method: semihost
  memory:
    ram_base: 0x40000000
    ram_size: 0x20000000
    kernel_load_address: 0x40010000
